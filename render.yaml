services:
  - type: web
    name: solo-metro-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_NAME
        value: Solo Metro
      - key: PYTHONUNBUFFERED
        value: "1"
